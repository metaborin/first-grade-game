<!doctype html>
<html lang="ja"><meta charset="utf-8"><title>まなびRPG オリジナルアイコン</title>
<body><h1>まなびRPG オリジナルアイコン</h1><p>このプロジェクト用に描いた、星の帽子と学びの本です。アイコンを押すと保存できます。</p>
<script>
// Original geometric artwork; no fonts, emoji or external images required.
function drawIcon(canvas, size, maskable = false) {
  canvas.width = canvas.height = size;
  const context = canvas.getContext('2d');
  context.fillStyle = '#172033'; context.fillRect(0, 0, size, size);
  context.save();
  const scale = size / 32 * (maskable ? 0.74 : 0.94);
  context.translate(size / 2, size / 2); context.scale(scale, scale); context.translate(-16, -16);
  function rect(x, y, w, h, color) { context.fillStyle = color; context.fillRect(x, y, w, h); }
  rect(7, 15, 18, 10, '#526ff0'); rect(9, 13, 14, 8, '#ffc7a1');
  rect(10, 15, 3, 3, '#172033'); rect(19, 15, 3, 3, '#172033');
  rect(14, 19, 4, 1, '#b35a5b');
  context.fillStyle = '#a68aff'; context.beginPath(); context.moveTo(16, 3); context.lineTo(24, 14); context.lineTo(8, 14); context.closePath(); context.fill();
  rect(6, 13, 20, 3, '#815bd5');
  rect(15, 6, 2, 7, '#ffe071'); rect(13, 8, 6, 2, '#ffe071');
  rect(5, 23, 22, 6, '#e6a94d'); rect(6, 22, 9, 6, '#fff4cf'); rect(17, 22, 9, 6, '#fff4cf');
  rect(15, 23, 2, 6, '#c38132'); rect(8, 24, 5, 1, '#947564'); rect(19, 24, 5, 1, '#947564');
  context.restore();
}
for (const [size, maskable] of [[192, false], [512, false], [512, true]]) {
  const canvas = document.createElement('canvas'); drawIcon(canvas, size, maskable);
  canvas.id = maskable ? 'icon-maskable-512' : 'icon-' + size;
  canvas.style.width = '192px'; canvas.style.height = '192px';
  const link = document.createElement('a'); link.href = canvas.toDataURL('image/png'); link.download = canvas.id + '.png';
  link.append(canvas); document.body.append(link);
}
</script></body></html>
